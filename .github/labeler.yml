# Labeler configuration for automatic PR labeling
# See: https://github.com/actions/labeler

# Documentation changes
documentation:
  - changed-files:
    - any-glob-to-any-file: 
      - 'docs/**/*.md'
      - '*.md'
      - 'examples/**/README.md'
      - 'examples/**/SECURITY_ANALYSIS.md'

# A2A Protocol
a2a:
  - changed-files:
    - any-glob-to-any-file:
      - 'docs/a2a/**'
      - 'examples/a2a_*/**'

# MCP Protocol  
mcp:
  - changed-files:
    - any-glob-to-any-file:
      - 'docs/mcp/**'
      - 'examples/mcp_*/**'

# Integration examples
integration:
  - changed-files:
    - any-glob-to-any-file:
      - 'docs/integration/**'
      - 'examples/*integration*/**'

# Stage-specific labels
stage-1:
  - changed-files:
    - any-glob-to-any-file:
      - 'examples/*/stage1_*/**'
      - 'examples/*/*stage1*/**'

stage-2:
  - changed-files:
    - any-glob-to-any-file:
      - 'examples/*/stage2_*/**'
      - 'examples/*/*stage2*/**'

stage-3:
  - changed-files:
    - any-glob-to-any-file:
      - 'examples/*/stage3_*/**'
      - 'examples/*/*stage3*/**'

# Examples
examples:
  - changed-files:
    - any-glob-to-any-file:
      - 'examples/**'

# Tools and utilities
tools:
  - changed-files:
    - any-glob-to-any-file:
      - 'tools/**'
      - 'scripts/**'
      - 'docs/supplementary/tools/**'

# Python code
python:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.py'
      - 'requirements.txt'
      - 'requirements.in'
      - '**/requirements*.txt'

# Configuration
configuration:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.json'
      - '**/*.toml'
      - '**/*.ini'
      - '.github/**'

# Dependencies
dependencies:
  - changed-files:
    - any-glob-to-any-file:
      - 'requirements.txt'
      - 'requirements.in'
      - '**/requirements*.txt'
      - 'package.json'
      - 'package-lock.json'

# Security Analysis
security-analysis:
  - changed-files:
    - any-glob-to-any-file:
      - '**/SECURITY_ANALYSIS.md'
      - 'docs/**/security/**'
      - 'docs/**/threat_model.md'

# Presentations
presentations:
  - changed-files:
    - any-glob-to-any-file:
      - 'docs/presentations/**'
      - '**/SLIDES.md'

# Tests
tests:
  - changed-files:
    - any-glob-to-any-file:
      - '**/test_*.py'
      - '**/tests/**'
      - '**/*_test.py'

# GitHub specific
github:
  - changed-files:
    - any-glob-to-any-file:
      - '.github/**'

# Contributing guidelines
contributing:
  - changed-files:
    - any-glob-to-any-file:
      - '**/CONTRIBUTING.md'
      - '**/contributing.md'
      - 'docs/about/contributing.md'
      - 'docs/CONTRIBUTORS_WANTED.md'

# Project structure
structure:
  - changed-files:
    - any-glob-to-any-file:
      - '**/learning_course_structure.md'
      - 'docs/INDEX.md'
      - 'docs/examples/index.md'
